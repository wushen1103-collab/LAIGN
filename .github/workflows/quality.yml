name: quality

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m compileall -q scripts figures tests
      - run: python scripts/tools/audit_release.py
      - run: pip install pytest
      - run: pytest -q
